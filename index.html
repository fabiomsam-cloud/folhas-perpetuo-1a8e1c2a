<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Folhas do Perpétuo</title>
<style>
/* Mesmo padrão visual das folhas do webinário e da Anne (.folha do painel da Anne) */
:root{--fundo:#E9EDF2;--tinta:#23344F;--azul:#1B3A66;--borda:#AEBBCB;--suave:#5A6678;--alerta:#B4532A;--verde:#2F7D62;--amarelo:#B7861F}
*{box-sizing:border-box;margin:0}
body{background:var(--fundo);color:var(--tinta);font-family:'DejaVu Sans',Verdana,-apple-system,sans-serif;padding:16px}
.wrap{max-width:1180px;margin:0 auto}
.barra{position:sticky;top:0;z-index:5;background:var(--fundo);padding:8px 0 12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.barra h1{font-size:1.25rem;font-weight:800;color:#1B2B45;margin-right:auto}
.nav{display:flex;gap:6px;align-items:center}
.nav button,.barra select,.nav input,.btn{font:inherit;font-size:.82rem;border:1px solid var(--borda);background:#fff;color:var(--tinta);border-radius:999px;padding:6px 12px;cursor:pointer}
.nav input{border-radius:8px;padding:5px 8px}
.nav button:disabled{opacity:.35;cursor:default}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem}
.filtros label{display:flex;gap:5px;align-items:center;color:var(--suave)}
.status{font-size:.8rem;color:var(--suave);margin:0 0 12px}
.status b{color:var(--tinta)}
.status .aviso{color:var(--alerta);font-weight:700}
.folha{background:#fff;color:var(--tinta);border-radius:10px;padding:22px 24px 16px;margin-bottom:18px}
.folha h3{font-size:1.4rem;font-weight:800;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#1B2B45}
.folha h3 button{font-size:.72rem;font-weight:700;background:#fff;border:1px solid var(--borda);color:var(--tinta);border-radius:999px;padding:5px 12px;cursor:pointer}
.folha .cab{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 18px;font-size:.84rem;margin:3px 0}
.folha .tw{overflow-x:auto;margin-top:8px}
.folha table{border-collapse:collapse;width:100%;min-width:860px;font-size:.8rem;border:1px solid var(--borda)}
.folha th{background:var(--azul);color:#fff;text-align:center;padding:5px 4px;font-weight:700;line-height:1.25}
.folha th:first-child{text-align:left;padding-left:10px}
.folha th small{display:block;font-weight:400;font-size:.72rem;opacity:.9}
.folha td{padding:3px 6px;border-bottom:1px solid var(--borda);border-left:1px solid var(--borda);text-align:center;color:#10233F;white-space:nowrap;height:21px}
.folha td.sec{width:18px;padding:0;border:none}
.folha td.sec span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);margin:0 auto;color:#fff;font-size:.55rem;font-weight:700;letter-spacing:.05em}
.folha td.lab{text-align:left;background:#F4F6F9;color:var(--tinta);width:250px}
.folha td.esq{text-align:left;white-space:normal}
.folha table.camp td.lab{width:110px}
.folha table.camp td.nm{min-width:320px}
.folha table.camp td.rs{min-width:250px}
.folha tr.dst td{font-weight:700}
.folha tr.dst td.lab{background:#E6EEF7}
.folha td.sem{background:#F1F3F6;font-weight:700}
.folha td.mes{background:#E6EEF7;font-weight:700}
.folha tr.tot td{font-weight:800;background:#E6EEF7}
.folha td.neg{color:var(--alerta);font-weight:700}
.folha td.pos{color:var(--verde);font-weight:700}
.folha .sub{font-size:.9rem;font-weight:800;margin-top:16px;color:#1B2B45}
.folha .sub small{font-weight:400;color:var(--suave)}
.com{margin-top:12px;border-top:1px solid var(--borda);padding-top:10px;font-size:.84rem;line-height:1.5}
.com h4{font-size:.86rem;font-weight:800;color:#1B2B45;margin:8px 0 4px}
.com ol,.com ul{padding-left:20px}
.com li{margin:3px 0}
.com .auto{font-size:.72rem;color:var(--suave)}
.al{list-style:none;padding:0!important}
.al li::before{content:"● ";font-size:.8em}
.al li.vermelho::before{color:var(--alerta)} .al li.amarelo::before{color:var(--amarelo)} .al li.verde::before{color:var(--verde)} .al li.aviso::before{color:var(--suave)}
.form{font-size:.68rem;color:var(--suave);margin-top:8px;line-height:1.5}
.vazio{background:#fff;border-radius:10px;padding:30px;text-align:center;color:var(--suave)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.72rem;font-weight:700}
.pill.ativa{background:#DDF1E7;color:#1F6B4E}.pill.pausada,.pill.parada{background:#EEF0F3;color:#5A6678}.pill.nenhuma{background:#FBE7DE;color:#9A4221}
@media (max-width:700px){body{padding:10px}.folha{padding:14px 12px}.folha h3{font-size:1.1rem}}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff;padding:0}
  .barra,.status,.folha h3 button{display:none!important}
  .folha{break-after:page;page-break-after:always;margin:0;padding:0;border-radius:0}
  .folha .tw{overflow:visible} .folha table{min-width:0;font-size:.72rem}
  .folha td{height:17px;padding:2px 5px} .folha tr{break-inside:avoid}
  body.print-uma .folha:not(.alvo){display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="barra">
    <h1>Folhas do Perpétuo</h1>
    <div class="nav">
      <button id="ant" title="Dia anterior">◀</button>
      <input type="date" id="data">
      <button id="prox" title="Dia seguinte">▶</button>
      <button id="hoje">Hoje</button>
    </div>
    <div class="filtros">
      <label>Folha <select id="fFolha"><option value="">Todas</option><option value="resumo">Resumo</option><option value="produtos">Por produto</option><option value="campanhas">Campanhas</option></select></label>
      <label>Produto <select id="fProd"><option value="">Todos</option></select></label>
      <label>Fase <select id="fFase"><option value="">Todas</option><option value="F1">F1 · atração</option><option value="F2">F2 · corredor</option><option value="F3">Cadastro (WEB/ING)</option><option value="BLIND">Blindado</option></select></label>
      <button class="btn" id="imp">Imprimir</button>
    </div>
  </div>
  <div class="status" id="status">Carregando…</div>
  <div id="folhas"></div>
</div>
<script>
const API = "https://dqpxugdhlgafvddavzzp.supabase.co/functions/v1/folhas-perpetuo";
const K = new URLSearchParams(location.search).get("k") || "";
const DIAS_SEM = ["SEG","TER","QUA","QUI","SEX","SÁB","DOM"];
const FASE_NOME = {F1:"F1",F2:"F2",F3:"WEB/ING",BLIND:"BLIND",OUTRAS:"outra"};
const $ = id => document.getElementById(id);
let LISTA = [], FOLHA = null;

const hojeManaus = () => new Date(Date.now() - 4*3600e3).toISOString().slice(0,10);
const ddmm = d => d ? d.slice(8,10)+"/"+d.slice(5,7) : "";
const addDia = (d,n) => { const x = new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const segunda = d => { const x = new Date(d+"T12:00:00Z"); const w = (x.getUTCDay()+6)%7; return addDia(d,-w); };
const nf = (v,c=0) => (v==null||!isFinite(v)) ? "—" : v.toLocaleString("pt-BR",{minimumFractionDigits:c,maximumFractionDigits:c});
const R = (v,c=0) => (v==null||!isFinite(v)) ? "—" : "R$ "+nf(v,c);
const X = v => (v==null||!isFinite(v)) ? "—" : nf(v,2)+"×";
const sinal = v => (v==null||!isFinite(v)) ? "—" : (v>=0?"+":"−")+"R$ "+nf(Math.abs(v));
const pct = v => (v==null||!isFinite(v)) ? "" : ` (${v>=0?"+":"−"}${nf(Math.abs(v*100))}%)`;
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(q){ const r = await fetch(API+"?k="+encodeURIComponent(K)+(q||"")); const j = await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j; }

async function iniciar(){
  if(!K){ $("status").innerHTML = '<span class="aviso">Falta o token no link (?k=…).</span>'; return; }
  try { LISTA = (await api()).dias.map(d => d.dia).sort(); }
  catch(e){ $("status").innerHTML = '<span class="aviso">Não consegui carregar as folhas: '+esc(e.message)+'</span>'; return; }
  const pedido = location.hash.slice(1);
  const hoje = hojeManaus();
  abrir(LISTA.includes(pedido) ? pedido : (LISTA.includes(hoje) ? hoje : LISTA[LISTA.length-1]), !LISTA.includes(pedido) && !LISTA.includes(hoje));
}

async function abrir(dia, semHoje){
  if(!dia){ $("folhas").innerHTML = '<div class="vazio">Ainda não há folhas.</div>'; return; }
  $("data").value = dia; $("data").min = LISTA[0]; $("data").max = LISTA[LISTA.length-1];
  const i = LISTA.indexOf(dia);
  $("ant").disabled = i <= 0; $("prox").disabled = i < 0 || i >= LISTA.length-1;
  history.replaceState(null, "", location.search + "#" + dia);
  $("status").textContent = "Carregando a folha de "+ddmm(dia)+"…";
  try { FOLHA = await api("&dia="+dia); }
  catch(e){ $("status").innerHTML = '<span class="aviso">Sem folha em '+ddmm(dia)+' ('+esc(e.message)+').</span>'; $("folhas").innerHTML=""; return; }
  const F = FOLHA.dados, com = FOLHA.comentarios || {};
  const quem = FOLHA.modelo === "auto" || com.automatico ? "comentário automático (histórico)" : "comentários de "+esc((FOLHA.modelo||"").replace("claude-","").replace(/-/g," "));
  $("status").innerHTML = (semHoje ? '<span class="aviso">A folha de hoje ainda não saiu (a rotina roda às 07h15). Mostrando a última. </span>' : "") +
    `Folha de <b>${ddmm(F.dia)}</b> · dados fechados até <b>${ddmm(F.dados_ate)}</b> · gerada ${esc(F.gerado_em.slice(11,16))} · ${quem}` +
    (F.avisos && F.avisos.length ? ' · <span class="aviso">'+F.avisos.map(esc).join(" · ")+'</span>' : "");
  if(!$("fProd").options.length || $("fProd").options.length < 2) F.produtos.forEach(p => $("fProd").add(new Option(p.nome, p.codigo)));
  desenhar();
}

function desenhar(){
  if(!FOLHA) return;
  const F = FOLHA.dados, com = FOLHA.comentarios || {};
  const tipo = $("fFolha").value, prod = $("fProd").value, fase = $("fFase").value;
  let h = "";
  if(!tipo || tipo==="resumo") h += folhaResumo(F, com, prod);
  if(!tipo || tipo==="produtos") F.produtos.filter(p => !prod || p.codigo===prod).forEach(p => h += folhaProduto(F, com, p, fase));
  if(!tipo || tipo==="campanhas") h += folhaCampanhas(F, prod, fase);
  $("folhas").innerHTML = h || '<div class="vazio">Nada com esses filtros.</div>';
}

function linhasResumo(F, prod){
  return F.resumo.filter(r => !prod || r.produto===prod);
}
function folhaResumo(F, com, prod){
  const rs = linhasResumo(F, prod);
  const pp = r => r.produto==="PLAYPASSEI";
  let t1 = "", t2 = "";
  const row1 = (r,cls="") => `<tr class="${cls}"><td class="lab">${esc(r.nome)}${pp(r)?" <small>(nossa metade)</small>":""}</td><td>${nf(r.mat)}</td><td>${R(r.rec)}</td><td>${nf(r.leads)}</td><td>${r.meta_imp?R(r.meta_imp):"—"}</td><td>${R(r.wa)}</td><td>${R(r.inv)}</td><td>${R(r.ret)}</td><td>${r.roas==null?(r.meta_imp?"—":"sem Meta"):X(r.roas)}</td></tr>`;
  rs.filter(r=>!pp(r)).forEach(r => { t1 += row1(r); if(r.produto==="PRF" && r.ing_n) t1 += `<tr><td class="lab">↳ ingresso PRF R$ 19,90</td><td>${nf(r.ing_n)} ingressos</td><td>${R(r.ing_v)}</td><td colspan="6" class="esq" style="color:#5A6678">incluso na linha da PRF</td></tr>`; });
  const T = F.total;
  if(!prod) t1 += row1({nome:"Total perpétuo",mat:T.mat,rec:T.rec,leads:T.leads,meta_imp:T.meta_imp,wa:T.wa,inv:T.inv,ret:T.ret,roas:T.roas},"tot");
  rs.filter(pp).forEach(r => t1 += row1(r));
  const row2 = (r,cls="") => { const c = r.dif>=0?"pos":(r.dif_pct!=null&&r.dif_pct<=-0.15?"neg":""); return `<tr class="${cls}"><td class="lab">${esc(r.nome)}</td><td>${R(r.inv)}</td><td>${R(r.plan_inv)}</td><td>${R(r.ret)}</td><td>${R(r.plan_ven)}</td><td class="${c}">${sinal(r.dif)}${pct(r.dif_pct)}</td><td>${r.roas==null?"—":X(r.roas)}</td><td>${X(r.roas_plano)}</td></tr>`; };
  rs.filter(r=>!pp(r)).forEach(r => t2 += row2(r));
  if(!prod) t2 += row2({nome:"Total",inv:T.inv,plan_inv:T.plan_inv,ret:T.ret,plan_ven:T.plan_ven,dif:T.dif,dif_pct:T.dif_pct,roas:T.roas,roas_plano:T.roas_plano},"tot");
  rs.filter(pp).forEach(r => t2 += row2(r));
  const pontos = (com.pontos||[]).map(p => `<li>${esc(p)}</li>`).join("");
  return `<section class="folha" data-id="resumo"><h3>Resumo do perpétuo <button onclick="imprimirUma(this)">Imprimir esta</button></h3>
  <div class="cab"><span>Mês ${esc(F.mes.slice(5))}/${esc(F.mes.slice(0,4))} · dias fechados até ${ddmm(F.dados_ate)} · sem Black</span><span>Plano até o dia = plano do mês pró-rata</span></div>
  <div class="sub">Resultado do mês</div>
  <div class="tw"><table><tr><th>Produto</th><th>Matrículas</th><th>Receita líquida<small>das matrículas</small></th><th>Leads gerados</th><th>Meta<small>com imposto</small></th><th>WhatsApp real</th><th>Investido total</th><th>Vendas do funil</th><th>ROAS</th></tr>${t1}</table></div>
  <div class="sub">Contra o plano até o dia</div>
  <div class="tw"><table><tr><th>Produto</th><th>Investido real</th><th>Plano previa investir</th><th>Vendas reais</th><th>Plano previa de vendas</th><th>Acima/abaixo do plano</th><th>ROAS real</th><th>ROAS do plano</th></tr>${t2}</table></div>
  <div class="com">${com.geral?`<p>${esc(com.geral)}</p>`:""}
    ${pontos?`<h4>O que os números dizem</h4><ol>${pontos}</ol>`:""}
    <h4>Como ler</h4><ul>
      <li><b>Matrículas</b> = só a 1ª parcela, sem recorrência e sem nada da Black. <b>Leads</b> = inscritos no webinário (ingressos na PRF) + popup do blindado.</li>
      <li><b>Vendas do funil</b> = regra do plano: webinário, Anne, site, ingresso e upsell, mais o vendedor quando o lead já tinha sido trabalhado (fica fora grupo frio e CS).</li>
      <li><b>WhatsApp real</b> = o que a Meta cobrou do número da Anne (sou-dw), em reais pela PTAX do dia, dividido pelos produtos conforme as mensagens de cada um.</li>
      <li><b>ROAS</b> = vendas do funil ÷ investido total. <b>Custo por 50%</b> = gasto ÷ pessoas que viram pelo menos metade do vídeo (régua da F1 e F2).</li>
    </ul>${com.automatico||FOLHA.modelo==="auto"?'<p class="auto">Comentário automático: dia do histórico, gerado só a partir dos alertas.</p>':""}</div></section>`;
}

const LINHAS = [
  {sec:"INVESTIMENTO",cor:"#4F6F9C",lab:"Meta F1/F2 (topo)",f:s=>s.meta_topo,fmt:"brl",fase:["F1","F2"]},
  {sec:"INVESTIMENTO",cor:"#4F6F9C",lab:"Meta cadastro (WEB/ING)",f:s=>s.meta_cad,fmt:"brl",fase:["F3"]},
  {sec:"INVESTIMENTO",cor:"#4F6F9C",lab:"Meta blindado",f:s=>s.meta_blind,fmt:"brl",fase:["BLIND"]},
  {sec:"INVESTIMENTO",cor:"#4F6F9C",lab:"Meta total com imposto",f:(s,F)=>s.meta*(1+F.imposto),fmt:"brl",dst:1},
  {sec:"INVESTIMENTO",cor:"#4F6F9C",lab:"WhatsApp real (Anne)",f:s=>s.wa,fmt:"brl"},
  {sec:"INVESTIMENTO",cor:"#4F6F9C",lab:"Investido total",f:(s,F)=>s.meta*(1+F.imposto)+s.wa,fmt:"brl",dst:1},
  {sec:"TOPO",cor:"#2F7D62",lab:"Viram 50% do vídeo (F1/F2)",f:s=>s.p50,fmt:"int",fase:["F1","F2"]},
  {sec:"TOPO",cor:"#2F7D62",lab:"Custo por 50%",f:s=>s.p50?s.meta_topo/s.p50:null,fmt:"c3",dst:1,fase:["F1","F2"]},
  {sec:"CAPTAÇÃO",cor:"#6A58A6",lab:"Inscritos no webinário",labPRF:"Ingressos (inscritos na aula)",f:s=>s.ins,fmt:"int",fase:["F3"]},
  {sec:"CAPTAÇÃO",cor:"#6A58A6",lab:"CPL (Meta cadastro ÷ inscritos)",labPRF:"Custo por ingresso",f:s=>s.ins?s.meta_cad/s.ins:null,fmt:"c2",dst:1,fase:["F3"]},
  {sec:"CAPTAÇÃO",cor:"#6A58A6",lab:"Leads do popup (blindado)",f:s=>s.pop,fmt:"int",fase:["BLIND"]},
  {sec:"CAPTAÇÃO",cor:"#6A58A6",lab:"Custo por lead do popup",f:s=>(s.pop&&s.meta_blind)?s.meta_blind/s.pop:null,fmt:"c2",fase:["BLIND"]},
  {sec:"RESULTADO",cor:"#C7742B",lab:"Matrículas",f:s=>s.mat,fmt:"int",dst:1},
  {sec:"RESULTADO",cor:"#C7742B",lab:"Receita líquida das matrículas",f:s=>s.rec,fmt:"brl"},
  {sec:"RESULTADO",cor:"#C7742B",lab:"Vendas do funil",f:s=>s.ret,fmt:"brl",dst:1},
  {sec:"RESULTADO",cor:"#C7742B",lab:"ROAS",f:(s,F)=>{const i=s.meta*(1+F.imposto)+s.wa; return s.meta>=1&&i?s.ret/i:null;},fmt:"x",dst:1},
  {sec:"PLANO",cor:"#8A3B3B",lab:"Investimento previsto",f:s=>s.plan_inv,fmt:"brl"},
  {sec:"PLANO",cor:"#8A3B3B",lab:"Vendas previstas",f:s=>s.plan_ven,fmt:"brl"},
  {sec:"PLANO",cor:"#8A3B3B",lab:"Acima/abaixo do plano (vendas)",f:s=>s.ret-s.plan_ven,fmt:"dif",dst:1},
];
const CHAVES = ["meta_topo","meta_cad","meta_blind","meta","p50","wa","ins","pop","mat","rec","ret","ing_n","ing_v","plan_inv","plan_ven"];
function somaSerie(ser, ds){ const o = {}; CHAVES.forEach(k => o[k] = ds.reduce((a,d) => a + ((ser[k]||{})[d]||0), 0)); return o; }
function fmtV(v, fmt){
  if(v==null||!isFinite(v)) return "";
  if(fmt==="brl") return v ? nf(v) : "0";
  if(fmt==="int") return nf(v);
  if(fmt==="c2") return nf(v,2);
  if(fmt==="c3") return nf(v,3);
  if(fmt==="x") return nf(v,2)+"×";
  if(fmt==="dif") return (v>=0?"+":"−")+nf(Math.abs(v));
  return nf(v);
}
function folhaProduto(F, com, p, fase){
  const ser = F.serie[p.codigo] || {};
  const ate = F.dados_ate, mesIni = F.mes+"-01";
  const seg = segunda(ate);
  const semana = [...Array(7)].map((_,i) => addDia(seg,i));
  const fechados = semana.filter(d => d <= ate && d >= mesIni);
  const mesDias = []; for(let d = mesIni; d <= ate; d = addDia(d,1)) mesDias.push(d);
  const cols = semana.map(d => (d <= ate && d >= mesIni) ? somaSerie(ser,[d]) : null);
  const sem = somaSerie(ser, fechados), mes = somaSerie(ser, mesDias);
  const ehPRF = p.codigo === "PRF";
  let linhas = LINHAS.filter(l => !fase || !l.fase || l.fase.includes(fase));
  if(ehPRF){ const i = linhas.findIndex(l => l.sec==="RESULTADO"); if(i>=0) linhas.splice(i+1,0,{sec:"RESULTADO",cor:"#C7742B",lab:"Ingressos vendidos (R$ 19,90)",f:s=>s.ing_n,fmt:"int"}); }
  const secs = [...new Set(linhas.map(l => l.sec))];
  let body = "";
  secs.forEach(sec => {
    const ls = linhas.filter(l => l.sec===sec);
    ls.forEach((l,i) => {
      const cel = s => s ? fmtV(l.f(s,F), l.fmt) : "";
      const cls = v => (l.fmt==="dif" && v!=null) ? (v<0?"neg":"pos") : "";
      body += `<tr class="${l.dst?"dst":""}${i===ls.length-1?" fim":""}">${i===0?`<td class="sec" rowspan="${ls.length}" style="background:${l.cor}"><span>${sec}</span></td>`:""}<td class="lab">${esc(ehPRF&&l.labPRF?l.labPRF:l.lab)}</td>${cols.map(s=>`<td class="${s?cls(l.f(s,F)):""}">${cel(s)}</td>`).join("")}<td class="sem ${cls(l.f(sem,F))}">${fechados.length?cel(sem):""}</td><td class="mes ${cls(l.f(mes,F))}">${cel(mes)}</td></tr>`;
    });
  });
  const al = (F.alertas||[]).filter(a => a.produto===p.codigo);
  const cp = (com.produtos||{})[p.codigo];
  const r = F.resumo.find(x => x.produto===p.codigo) || {};
  return `<section class="folha" data-id="${p.codigo}"><h3>${esc(p.nome)}${p.codigo==="PLAYPASSEI"?" <small style='font-size:.7rem;font-weight:400'>(nossa metade da mídia)</small>":""} <button onclick="imprimirUma(this)">Imprimir esta</button></h3>
  <div class="cab"><span>Semana ${ddmm(semana[0])} a ${ddmm(semana[6])} · dias fechados até ${ddmm(ate)}</span><span>Mês: ${nf(r.mat)} matrículas · vendas ${R(r.ret)} · plano ${R(r.plan_ven)} · <b>${sinal(r.dif)}${pct(r.dif_pct)}</b></span></div>
  <div class="tw"><table><tr><th colspan="2">Linha</th>${semana.map((d,i)=>`<th>${DIAS_SEM[i]}<small>${ddmm(d)}</small></th>`).join("")}<th>SEMANA<small>parcial · ${fechados.length} ${fechados.length===1?"dia":"dias"}</small></th><th>MÊS<small>até ${ddmm(ate)}</small></th></tr>${body}</table></div>
  ${(cp||al.length)?`<div class="com">${cp?`<p>${esc(cp)}</p>`:""}${al.length?`<ul class="al">${al.map(a=>`<li class="${a.nivel}">${esc(a.texto)}</li>`).join("")}</ul>`:""}</div>`:""}
  <div class="form">Taxas da SEMANA e do MÊS recalculadas pelos volumes. Investido = Meta × ${nf(1+F.imposto,4)} + WhatsApp real. Dias antes do 1º do mês ficam em branco.</div></section>`;
}
function folhaCampanhas(F, prod, fase){
  const nome = Object.fromEntries(F.produtos.map(p => [p.codigo, p.nome]));
  const res = Object.fromEntries(F.resumo.map(r => [r.produto, r]));
  const cs = F.campanhas.filter(c => (!prod || c.produto===prod) && (!fase || c.fase===fase));
  if(!cs.length) return "";
  const resultado = c => {
    const r = res[c.produto] || {};
    if(c.status==="nenhuma") return "plano previa "+R(c.plano_mes)+" no mês";
    if(c.fase==="F1"||c.fase==="F2") return c.cp50!=null ? `R$ ${nf(c.cp50,3)} por 50%`+(c.cp50_7!=null?` (7d R$ ${nf(c.cp50_7,3)})`:"") : "—";
    if(c.fase==="F3" && c.produto!=="PLAYPASSEI") return r.cpl!=null ? `${c.produto==="PRF"?"R$ "+nf(r.cpl,2)+" por ingresso":"CPL R$ "+nf(r.cpl,2)} (7d ${r.cpl7!=null?"R$ "+nf(r.cpl7,2):"—"}) · do produto` : "—";
    if(c.fase==="BLIND") return r.cpop!=null ? `R$ ${nf(r.cpop,2)} por lead do popup`+(r.cpop7!=null?` (7d R$ ${nf(r.cpop7,2)})`:"") : "—";
    return "—";
  };
  const st = c => `<span class="pill ${c.status}">${c.status==="parada"?"sem gasto no dia":c.status}</span>`;
  const rows = cs.map(c => `<tr><td class="lab">${esc(nome[c.produto]||c.produto)}</td><td>${FASE_NOME[c.fase]||c.fase}</td><td class="esq nm">${c.nome?esc(c.nome):"<i>nenhuma campanha</i>"}</td><td>${st(c)}</td><td>${c.conj!=null?nf(c.conj)+" · "+R(c.orc):"—"}</td><td>${c.gasto!=null?R(c.gasto):"0"}</td><td>${c.ritmo3?R(c.ritmo3):"—"}</td><td class="esq rs">${resultado(c)}</td></tr>`).join("");
  const vivo = F.campanhas.some(c => c.status_vivo);
  return `<section class="folha" data-id="campanhas"><h3>Campanhas por produto <button onclick="imprimirUma(this)">Imprimir esta</button></h3>
  <div class="cab"><span>Gasto do mês até ${ddmm(F.dados_ate)} · ritmo = média dos 3 últimos dias fechados</span><span>${vivo?"Status e orçamento ao vivo (sou-dw)":"Dia do histórico: status deduzido pelo gasto do dia"}</span></div>
  <div class="tw"><table class="camp"><tr><th>Produto</th><th>Fase</th><th>Campanha</th><th>Status</th><th>Conjuntos ativos · orçamento/dia</th><th>Gasto no mês</th><th>Ritmo/dia</th><th>Resultado no mês (7 dias)</th></tr>${rows}</table></div>
  <div class="form">Play Passei aparece com o gasto cheio da conta; nas folhas de produto conta só a nossa metade. "Nenhuma campanha" = o plano do mês tem verba na fase e não há campanha ativa.</div></section>`;
}
function imprimirUma(btn){ const s = btn.closest(".folha"); s.classList.add("alvo"); document.body.classList.add("print-uma"); window.print(); document.body.classList.remove("print-uma"); s.classList.remove("alvo"); }

$("ant").onclick = () => { const i = LISTA.indexOf($("data").value); if(i>0) abrir(LISTA[i-1]); };
$("prox").onclick = () => { const i = LISTA.indexOf($("data").value); if(i>=0 && i<LISTA.length-1) abrir(LISTA[i+1]); };
$("hoje").onclick = () => { const h = hojeManaus(); abrir(LISTA.includes(h) ? h : LISTA[LISTA.length-1], !LISTA.includes(h)); };
$("data").onchange = e => abrir(e.target.value);
["fFolha","fProd","fFase"].forEach(id => $(id).onchange = desenhar);
$("imp").onclick = () => window.print();
iniciar();
</script>
</body>
